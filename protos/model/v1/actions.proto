syntax = "proto3";

import "google/protobuf/timestamp.proto";

package v1.model;

option go_package = "github.com/GOAT-Robotics/gtstudio-proto/protos/v1/model";

message ActionRequest {
    string id = 1;
    string command = 2;
    bool compressed = 3;
    string data = 4;
    google.protobuf.Timestamp scrubber_time = 5;
    string parent_id = 6;
    int64 retry_count = 7;
    int64 seq_num = 8;
    // High availability fencing. ha_term is the Raft term of the HerdIQ leader
    // that issued this request for raft group ha_group (the world slug). Agents
    // reject a request whose ha_term is lower than the highest term already
    // seen for the same ha_group. ha_term == 0 means not fenced.
    uint64 ha_term = 9;
    string ha_group = 10;
}
      
message ActionResponse {
  string request_id = 1;
  bool status = 2;
  bool isResult = 3;
  oneof result {
    string data = 4;
    bytes raw = 5;
    string error = 6;
  }
  string parent_id = 7;
  int64 retry_count = 8;
  int64 seq_num = 9;
}